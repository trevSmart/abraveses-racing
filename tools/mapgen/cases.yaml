    frame_w: 0.14
    roller: [120, 78, 52]
  parts:
    part1:
      floors: 2
      eave_m: 6.0
      roof: {type: hip, wings: true, pitch_deg: 24, overhang_m: 0.45, fascia: [150, 64, 48]}
      # Façana del carrer: quatre finestres amb porticons de fusta tancats i tendal de ratlles.
      openings:
        - {kind: window, t: 0.22, w: 1.0, h: 1.1, sill_m: 1.1, fill: [92, 58, 40], awning: {depth_m: 0.7, color: [158, 86, 58], stripe: [232, 214, 186]}}
