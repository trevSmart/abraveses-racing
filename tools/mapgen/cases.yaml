# Cantonada de la C. Santibáñez amb la Rinconada (7727): salmó amb sòcol de pedra i tendals de
# ratlles. part1 és la casa (planta en L); part2, el garatge de davant a l'osca de la cantonada,
# amb teulada d'una aigua i, a sobre, el pis enretirat amb un balcó de fusta. El pati de l'est i les
# seves tàpies (crema, portal de vianants a la cantonada i paret de tova) són a walls.yaml.
0232108TM6503S:
