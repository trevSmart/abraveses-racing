          openings:
            - {kind: window, t: 0.12, w: 0.5, h: 0.6, sill_m: 1.4}
            - {kind: window, floor: 1, t: 0.45, w: 0.6, h: 0.9, sill_m: 0.9, roller: 0.9}
        # Façana del pati de l'ala oest (la segona S). Dalt, la terrassa amb finestra i porta.
