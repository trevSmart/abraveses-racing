# Postes de formigó de la xarxa de baixa tensió. Situats a Street View (set. 2024):
# la càmera del panorama, el costat del carrer i la distància, i després enganxats al
# voral del carrer de l'OSM (a 4,15 m de l'eix) perquè no quedin dins la calçada del joc.
# `at` és UTM (EPSG:25830). Els de la mateixa `line` s'uneixen amb cables si el tram fa
# menys de 72 m. `lamp` hi afegeix un braç de fanal cap al carrer.
